# 大学祭モードを、本番とは別のサイトのトップ（/）に公開する。
# 本編からは大学祭モードを外すので、festival ブランチから作る。festival ブランチは、展示したときの状態
# （タグ festival-2026-11-01）に、大学祭モードだけをトップから出す変更を足したもの。
# 公開先は、同じ Firebase プロジェクトの中の大学祭用のサイト（Firebase コンソールの Hosting で「別のサイトを追加」して作る）。
# GitHub の Actions のタブから、手で動かす
name: Deploy festival
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 公開するブランチかタグ
        required: true
        default: festival
permissions:
  contents: read
concurrency:
  group: festival
  cancel-in-progress: false
env:
  # 大学祭用のサイトのID。公開先のURLは https://<ID>.web.app になる
  FESTIVAL_SITE: oyaoya-festival
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # ブランチの中の firebase.json は本番のサイト向けなので、大学祭用のサイト向けに書き換える。
      # 以前の /festival 付きのURLで開かれたら、先頭の /festival を外したURLへ移す
      - name: Write firebase.json for the festival site
        run: |
          cat > firebase.json <<EOF
          {
            "hosting": {
              "site": "${FESTIVAL_SITE}",
              "public": "dist",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "redirects": [
                { "source": "/festival", "destination": "/", "type": 301 },
                {
                  "source": "/festival/:rest*",
                  "destination": "/:rest",
                  "type": 301
                }
              ],
              "rewrites": [{ "source": "**", "destination": "/index.html" }]
            }
          }
          EOF
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OYAOYA_844EA }}
          channelId: live
          projectId: oyaoya-844ea
