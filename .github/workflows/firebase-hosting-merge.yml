name: Deploy to production on merge
on:
  push:
    branches:
      - main
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OYAOYA_844EA }}
      - run: npx firebase deploy --only firestore:rules --project oyaoya-844ea --non-interactive
      - run: npm run content:import -- --production
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OYAOYA_844EA }}
          channelId: live
          projectId: oyaoya-844ea
