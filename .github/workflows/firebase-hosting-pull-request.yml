name: Deploy preview on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    # フォークとDependabotのPRには本番用のsecretが渡らないため、プレビューは作らない
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    env:
      CONTENT_ROOT: previews/pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OYAOYA_844EA }}
      - run: npm run content:import -- --production --root "$CONTENT_ROOT"
      - run: npm run build
        env:
          VITE_CONTENT_ROOT: ${{ env.CONTENT_ROOT }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OYAOYA_844EA }}
          projectId: oyaoya-844ea
