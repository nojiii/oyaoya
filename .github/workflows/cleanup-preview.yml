name: Clean up preview data on PR close
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
jobs:
  cleanup:
    # プレビューを作らないPR（フォーク・Dependabot）は削除も不要
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OYAOYA_844EA }}
      - run: npm run content:remove -- --production --root "previews/pr-${{ github.event.pull_request.number }}"
