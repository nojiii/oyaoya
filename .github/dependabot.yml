version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    # 公開直後のバージョンは避ける（不具合や悪意ある公開の巻き込まれ防止）
    cooldown:
      default-days: 7
    # minor / patch は1つのPRにまとめる。major は個別のPRで確認する
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      # 脆弱性の修正（security updates）は、週1回の更新とは別にすぐ作られる。
      # 複数あっても1つのPRにまとめる。上の cooldown（7日待つ設定）は効かない
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # 型定義は実行するNode.js（.nvmrc）のメジャーバージョンに合わせる
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # typescript-eslint が対応する範囲（peerDependencies）を超えると npm ci が失敗する。
      # minor / major は typescript-eslint の対応を確認してから手動で上げる
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
