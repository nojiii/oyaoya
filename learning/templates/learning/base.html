<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Oyaoya{% endblock %}</title>
  <style>
    :root {
      --color-bg: #ffffff;
      --color-text: #4a3b2a;
      --color-accent: #c8895a;
      --color-border: #e7dfd6;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 1.25rem 2rem;
      line-height: 1.7;
      background: var(--color-bg);
      color: var(--color-text);
    }
    a { color: var(--color-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { padding: 1.5rem 0 0.5rem; }
    header h1 { font-size: 1.25rem; margin: 0; }
    header h1 a { color: inherit; }
    ul.list { list-style: none; padding: 0; margin: 0; }
    ul.list li { margin: 0.75rem 0; }
    ul.list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      font-weight: bold;
    }
    section.step { margin: 1.5rem 0; }
    section.step h2 { border-left: 4px solid var(--color-accent); padding-left: 0.5rem; }
    nav.breadcrumb { font-size: 0.85rem; color: #8a7a68; margin-bottom: 1rem; }
  </style>
</head>
<body>
  {% block header %}
  <header>
    <h1><a href="{% url 'learning:home' %}">Oyaoya</a></h1>
  </header>
  {% endblock %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
