<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Oyaoya{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.7; }
    a { color: #d1782a; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header h1 { font-size: 1.25rem; }
    header h1 a { color: inherit; }
    ul.list { list-style: none; padding: 0; }
    ul.list li { margin: 0.5rem 0; }
    ul.list a { display: block; padding: 0.75rem 1rem; border: 1px solid #ddd; border-radius: 0.5rem; }
    section.step { margin: 1.5rem 0; }
    section.step h2 { border-left: 4px solid #d1782a; padding-left: 0.5rem; }
    nav.breadcrumb { font-size: 0.85rem; color: #666; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{% url 'learning:home' %}">Oyaoya</a></h1>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
