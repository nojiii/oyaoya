# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# AIレビューは人のレビューの補助。指摘への対応はマージの必須条件にしない
language: ja-JP
reviews:
  profile: chill
  request_changes_workflow: false
  poem: false
  in_progress_fortune: false
  path_filters:
    - '!package-lock.json'
  path_instructions:
    - path: src/**
      instructions: >-
        問題は src/problems/ に1問1フォルダで置き、その問題だけで使う部品・画像・スタイルも同じフォルダに置く方針。
        階層は src/curriculum.ts に書く。
        問題専用のスタイルを src/index.css に足していたら、問題のフォルダの *.module.css へ移すよう指摘する。
        問題の文章はソースコードに直接書く方針のため、文言の集約や国際化対応は求めない。
        自動テストは置かない方針のため、テストの追加は求めない
        （正誤判定や採点など分岐のあるロジックを追加した場合を除く）。
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - dependabot[bot]
chat:
  auto_reply: true
