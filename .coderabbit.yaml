# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# AIレビューは人のレビューの補助。指摘への対応はマージの必須条件にしない
language: ja-JP
reviews:
  profile: chill
  request_changes_workflow: false
  poem: false
  in_progress_fortune: false
  path_filters:
    - '!package-lock.json'
  path_instructions:
    - path: src/**
      instructions: >-
        教材の読み込みは src/content/api.ts に集約する方針。
        ページやコンポーネントから virtual:content を直接 import していたら指摘する。
        自動テストは置かない方針のため、テストの追加は求めない
        （正誤判定や採点など分岐のあるロジックを追加した場合を除く）。
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - dependabot[bot]
chat:
  auto_reply: true
